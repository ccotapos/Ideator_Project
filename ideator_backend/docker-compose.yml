version: '3.8'

services:
  postgres_db:
    image: postgres:16-alpine
    container_name: ideator_db_container
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d

  backend:
    build: .
    container_name: ideator_backend_container
    ports:
      - "3000:3000"
    environment:
      - PORT=${PORT}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - JWT_SECRET=${JWT_SECRET}
      - FRONTEND_ORIGIN=${FRONTEND_ORIGIN}
      - SSO_ISSUER_URL=${SSO_ISSUER_URL}
      - SSO_CLIENT_ID=${SSO_CLIENT_ID}
      - SSO_CLIENT_SECRET=${SSO_CLIENT_SECRET}
      - SSO_REDIRECT_URI=${SSO_REDIRECT_URI}
      - SSO_PROVIDER_NAME=${SSO_PROVIDER_NAME}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL}
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      - postgres_db

  frontend:
    build: ../frontend
    container_name: ideator_frontend_container
    ports:
      - "5173:5173"
    environment:
      # El frontend usa el proxy de Vite (ver vite.config.js), así que
      # las requests salen como rutas relativas ("/api/...").
      - VITE_API_URL=
      # Dentro de la red de docker-compose, el backend se llama "backend",
      # no "localhost".
      - VITE_PROXY_TARGET=http://backend:3000
    volumes:
      - ../frontend:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data: